# Blueprint for the amplifier trigger layer: the web service that receives
# Typefully webhook deliveries and starts workflow runs, plus the Key Value
# instance that records which posts have already been announced. The Workflow
# service itself is created separately because Blueprints don't support
# Workflows yet.
#
# Order: create the Workflow service, create the two env groups by hand with
# their values, apply this Blueprint, copy the amplifier-kv internal connection
# string into the Workflow service's REDIS_URL, then register the receiver's
# public URL in Typefully under Settings > API and copy the signing secret back
# into TYPEFULLY_WEBHOOK_SECRET.
projects:
  - name: amplifier
    environments:
      - name: Production
        services:
          - type: web
            name: amplifier-webhook
            runtime: node
            plan: starter
            region: oregon
            buildCommand: pnpm install && pnpm build
            startCommand: node dist/webhook-server.js
            healthCheckPath: /healthz
            autoDeployTrigger: commit
            envVars:
              - fromGroup: amplifier-triggers

          - type: keyvalue
            name: amplifier-kv
            plan: starter
            region: oregon
            maxmemoryPolicy: noeviction
            # Reachable only over the private network, so the Workflow service
            # must be in this same workspace and region. Its project and
            # environment do not have to match.
            ipAllowList: []

        envVarGroups:
          # Both groups are created by hand, with their values, before this
          # Blueprint is applied. `sync: false` is ignored inside an env var
          # group, so a group cannot prompt for a value and cannot carry a secret
          # from this file. README, Deployment step 4, lists the keys to add.
          #
          # DISPATCH_TOKEN is deliberately absent. It gates POST /tasks/:task,
          # which nothing in amplifier uses, and leaving it unset makes that route
          # answer 401 to everything. Do not add it to make that route work; it
          # should stay shut.
          - name: amplifier-triggers
            envVars: []

          # Vendor keys for the hand-created Workflow service. No service in this
          # Blueprint references this group: the receiver only starts runs.
          # Attach it to the Workflow service in the dashboard.
          - name: amplifier-workflow
            envVars:
              - key: AMPLIFIER_SUMMARY_MODEL
                value: anthropic/claude-sonnet-5
